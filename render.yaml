services:
  - type: web
    name: jnv-markflow
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate && python manage.py seed_initial_data
    startCommand: gunicorn jnv_marks.wsgi:application
    healthCheckPath: /login/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: marks.jnvernakulam.com,jnv-markflow.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://marks.jnvernakulam.com,https://jnv-markflow.onrender.com
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: TEACHER_USERNAME
        sync: false
      - key: TEACHER_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: jnv-markflow-db
          property: connectionString

  - type: pserv
    name: jnv-markflow-db
    plan: starter
    databaseName: jnv_markflow
    user: jnv_markflow
